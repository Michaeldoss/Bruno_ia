name: Validate Bruno

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest pytest-asyncio
      - name: Run existing unit tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: python -m unittest discover -s tests -v
      - name: Run new SDR tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: python -m pytest -q tests/test_sdr_policy.py tests/test_llm_provider.py tests/test_bruno_sdr_engine.py tests/test_commercial_guard.py
