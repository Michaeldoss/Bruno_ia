name: Bruno SDR isolated tests
on:
  push:
    branches:
      - feat/bruno-openai-sdr-20261118
  pull_request:
    paths:
      - 'app/services/llm_provider.py'
      - 'app/services/sdr_policy.py'
      - 'app/services/bruno_sdr_engine.py'
      - 'tests/test_*sdr*.py'
      - 'tests/test_llm_provider.py'
      - 'app/services/commercial_guard.py'
      - 'app/services/sdr_quality.py'
      - 'tests/test_sdr_quality.py'
      - 'app/services/conversation_continuity.py'
      - 'tests/test_conversation_continuity.py'
      - 'tests/test_commercial_guard.py'
      - '.github/workflows/bruno-sdr-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest pytest-asyncio openai
      - name: Compile SDR modules
        run: python -m compileall -q app/services/llm_provider.py app/services/sdr_policy.py app/services/bruno_sdr_engine.py app/services/commercial_guard.py app/services/conversation_continuity.py app/services/sdr_quality.py
      - name: Run SDR unit tests
        run: python -m pytest -q tests/test_sdr_policy.py tests/test_llm_provider.py tests/test_bruno_sdr_engine.py tests/test_commercial_guard.py tests/test_conversation_continuity.py tests/test_sdr_quality.py
